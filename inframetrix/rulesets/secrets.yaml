rules:
  - id: committed-env-file
    title: Environment file detected
    severity: critical
    category: secrets
    file_patterns:
      - ".env"
      - ".env.local"
      - ".env.production"
      - ".env.development"
      - ".env.*"
    message: "File is present in the project tree."
    recommendation: "Do not commit real .env files. Use .env.example without secrets."
    confidence: high

  - id: unsafe-secret-fallback-jwt-secret
    title: Unsafe secret fallback
    severity: critical
    category: auth
    patterns:
      - "JWT_SECRET || 'secret'"
      - 'JWT_SECRET || "secret"'
      - "JWT_SECRET || 'changeme'"
      - 'JWT_SECRET || "changeme"'
    message: "JWT_SECRET has a fallback to a default value."
    recommendation: "Fail closed when secrets are missing. Never use default production secrets."
    confidence: high
    languages:
      - javascript
      - typescript

  - id: unsafe-secret-fallback-secret-key
    title: Unsafe secret fallback
    severity: critical
    category: auth
    patterns:
      - "SECRET_KEY = 'secret'"
      - 'SECRET_KEY = "secret"'
    message: "SECRET_KEY is set to a default value."
    recommendation: "Fail closed when secrets are missing. Never use default production secrets."
    confidence: high
    languages:
      - python

  - id: unsafe-secret-fallback-password
    title: Unsafe secret fallback
    severity: critical
    category: auth
    patterns:
      - "password = 'password'"
      - 'password = "password"'
    message: "Password is set to a default value."
    recommendation: "Fail closed when secrets are missing. Never use default production secrets."
    confidence: high

  - id: unsafe-secret-fallback-api-key
    title: Unsafe secret fallback
    severity: critical
    category: auth
    patterns:
      - "api_key = 'test'"
      - 'api_key = "test"'
    message: "API key is set to a test value."
    recommendation: "Fail closed when secrets are missing. Never use default production secrets."
    confidence: high
