[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inframetrix"
version = "0.1.0"
description = "Security, architecture, and infrastructure risk analyzer for AI-built projects"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Danii-workk", email = "danii-workk@users.noreply.github.com" }
]
keywords = ["security", "analyzer", "infrastructure", "ai", "devops", "scanner", "risk"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.0.0",
  "pydantic>=2.0.0",
  "pyyaml>=6.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0"
]

[project.scripts]
inframetrix = "inframetrix.cli:app"

[project.urls]
Homepage = "https://github.com/danii-workk/inframetrix"
Repository = "https://github.com/danii-workk/inframetrix"
Issues = "https://github.com/danii-workk/inframetrix/issues"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["inframetrix*"]

[tool.setuptools.package-data]
inframetrix = ["rulesets/*.yaml"]