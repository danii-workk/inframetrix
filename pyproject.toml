[project]
name = "inframetrix"
version = "0.1.0"
description = "Security, architecture, and infrastructure risk analyzer for AI-built projects"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Danii-workk" }
]
dependencies = [
  "typer>=0.12.0",
  "rich>=13.0.0",
  "pydantic>=2.0.0",
  "pyyaml>=6.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0"
]

[project.scripts]
inframetrix = "inframetrix.cli:app"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["inframetrix*"]

[tool.setuptools.package-data]
inframetrix = ["rulesets/*.yaml"]
